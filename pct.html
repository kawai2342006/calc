<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧百分比與加倉計算器</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 480px; margin: auto; background-color: #f8fafc; }
    .card { background: #fff; border: 1px solid #e2e8f0; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06); margin-bottom: 2rem; }
    .input-group { margin-bottom: 1.1rem; }
    label { display: block; margin-bottom: 0.35rem; font-weight: 600; color: #334155; font-size: 0.95rem; }
    input { width: 100%; padding: 0.6rem; box-sizing: border-box; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 6px; }
    input.auto-calculated { background-color: #f0fdf4; border-color: #22c55e; }
    input[readonly] { background-color: #f1f5f9; color: #1e293b; font-weight: 600; cursor: not-allowed; border-color: #e2e8f0; }
    .status { font-size: 0.85rem; color: #64748b; margin-top: 0.8rem; }
    .divider { height: 1px; background-color: #e2e8f0; margin: 1.3rem 0; }
    .badge { display: inline-block; padding: 0.2rem 0.5rem; font-size: 0.75rem; border-radius: 4px; background: #e0f2fe; color: #0369a1; font-weight: 700; margin-bottom: 0.5rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  </style>
</head>
<body>

<!-- 第一部分：原本的三向百分比計算器 -->
<div class="card">
  <h2>智慧百分比變量計算器</h2>
  
  <div class="input-group">
    <label for="v1">初始值 (Initial Value)</label>
    <input type="number" id="v1" step="any" placeholder="請輸入數值">
  </div>

  <div class="input-group">
    <label for="v2">最終值 (Final Value)</label>
    <input type="number" id="v2" step="any" placeholder="請輸入數值">
  </div>

  <div class="input-group">
    <label for="pct">變更百分比 (Percent Change %)</label>
    <input type="number" id="pct" step="any" placeholder="請輸入百分比">
  </div>

  <div class="divider"></div>

  <div class="input-group">
    <label for="maxPos">最大倉位佔比 (Max Position%) [-1%Total]</label>
    <input type="text" id="maxPos" placeholder="自動計算" readonly>
  </div>

  <div class="status" id="statusText">請輸入任意 2 個數值來計算第 3 個數值。</div>
</div>

<!-- 第二部分：二次加倉風控計算器 -->
<div class="card">
  <span class="badge">Qullamaggie 風控模型</span>
  <h2 style="margin-top: 0.3rem;">二次加倉 (Pyramiding) 計算器</h2>

  <div class="grid-2">
    <div class="input-group">
      <label for="p1">Trade 1 倉位 P1 (%)</label>
      <input type="number" id="p1" step="any" placeholder="請輸入數值">
    </div>
    <div class="input-group">
      <label for="b1">Trade 1 買入價 B1 ($)</label>
      <input type="number" id="b1" step="any" placeholder="請輸入數值">
    </div>
  </div>

  <div class="input-group">
    <label for="t1InitialSL">Trade 1 初始止蝕價 (-1% Total Loss)</label>
    <input type="text" id="t1InitialSL" placeholder="自動計算 (填入 P1 與 B1)" readonly>
  </div>

  <div class="input-group">
    <label for="sl">全新統一止蝕價 New SL ($)</label>
    <input type="number" id="sl" step="any" placeholder="請輸入數值">
  </div>

  <div class="input-group">
    <label for="b2">Trade 2 加倉買入價 B2 ($)</label>
    <input type="number" id="b2" step="any" placeholder="請輸入數值">
  </div>

  <div class="input-group">
    <label for="maxLoss">允許總損失上限 (% of Total Equity)</label>
    <input type="number" id="maxLoss" step="any" value="1.0">
  </div>

  <div class="divider"></div>

  <div class="input-group">
    <label for="p2Max">最多可加倉位 P2 (Max Position 2 %)</label>
    <input type="text" id="p2Max" placeholder="自動計算" readonly>
  </div>

  <div class="grid-2">
    <div class="input-group">
      <label for="totalPos">合併總倉位 (P1 + P2)</label>
      <input type="text" id="totalPos" placeholder="-" readonly>
    </div>
    <div class="input-group">
      <label for="avgCost">合併平均成本 ($)</label>
      <input type="text" id="avgCost" placeholder="-" readonly>
    </div>
  </div>

  <div class="status" id="pyramidStatus">請填入 P1、B1、New SL 與 B2。</div>
</div>

<script>
  // --- 原計算器邏輯 ---
  const inputs = {
    v1: document.getElementById('v1'),
    v2: document.getElementById('v2'),
    pct: document.getElementById('pct')
  };
  const maxPosInput = document.getElementById('maxPos');
  const statusText = document.getElementById('statusText');
  let history = [];

  Object.keys(inputs).forEach(key => {
    inputs[key].addEventListener('input', () => onInputChanged(key));
  });

  function onInputChanged(changedKey) {
    history = history.filter(id => id !== changedKey);
    history.push(changedKey);
    if (history.length > 2) history.shift();
    if (history.length === 2) calculateThirdField();
    updateMaxPosition();
  }

  function calculateThirdField() {
    const allKeys = ['v1', 'v2', 'pct'];
    const v1 = parseFloat(inputs.v1.value);
    const v2 = parseFloat(inputs.v2.value);
    const pct = parseFloat(inputs.pct.value);

    allKeys.forEach(k => inputs[k].classList.remove('auto-calculated'));

    if (history.includes('v1') && history.includes('v2')) {
      if (!isNaN(v1) && !isNaN(v2) && v1 !== 0) {
        const calculatedPct = ((v2 - v1) / Math.abs(v1)) * 100;
        inputs.pct.value = Number(calculatedPct.toFixed(4));
        inputs.pct.classList.add('auto-calculated');
        statusText.innerText = '已根據「初始值」與「最終值」自動推導「變更百分比」。';
      }
    } else if (history.includes('v2') && history.includes('pct')) {
      if (!isNaN(v2) && !isNaN(pct) && (1 + pct / 100) !== 0) {
        const calculatedV1 = v2 / (1 + pct / 100);
        inputs.v1.value = Number(calculatedV1.toFixed(4));
        inputs.v1.classList.add('auto-calculated');
        statusText.innerText = '已根據「最終值」與「變更百分比」自動推導「初始值」。';
      }
    } else if (history.includes('v1') && history.includes('pct')) {
      if (!isNaN(v1) && !isNaN(pct)) {
        const calculatedV2 = v1 * (1 + pct / 100);
        inputs.v2.value = Number(calculatedV2.toFixed(4));
        inputs.v2.classList.add('auto-calculated');
        statusText.innerText = '已根據「初始值」與「變更百分比」自動推導「最終值」。';
      }
    }
  }

  function updateMaxPosition() {
    const pct = parseFloat(inputs.pct.value);
    if (!isNaN(pct) && pct !== 0) {
      const maxPosPercent = (1 / Math.abs(pct)) * 100;
      maxPosInput.value = Number(maxPosPercent.toFixed(2)) + '%';
    } else {
      maxPosInput.value = '';
    }
  }

  // --- 二次加倉 (Pyramiding) 計算邏輯 ---
  const pyramidInputs = ['p1', 'b1', 'sl', 'b2', 'maxLoss'].map(id => document.getElementById(id));
  const t1InitialSLOut = document.getElementById('t1InitialSL');
  const p2MaxOut = document.getElementById('p2Max');
  const totalPosOut = document.getElementById('totalPos');
  const avgCostOut = document.getElementById('avgCost');
  const pyramidStatus = document.getElementById('pyramidStatus');

  pyramidInputs.forEach(el => el.addEventListener('input', calculatePyramiding));

  function calculatePyramiding() {
    const p1 = parseFloat(document.getElementById('p1').value); // 百分比數字 (如 9.49)
    const b1 = parseFloat(document.getElementById('b1').value);
    const sl = parseFloat(document.getElementById('sl').value);
    const b2 = parseFloat(document.getElementById('b2').value);
    const maxLossVal = parseFloat(document.getElementById('maxLoss').value);
    const maxLoss = (!isNaN(maxLossVal) ? maxLossVal : 1.0) / 100; // 預設 1%

    // 1. 自動計算 Trade 1 初始止蝕位：止蝕價 = B1 * (1 - (maxLossVal / P1))
    if (!isNaN(p1) && !isNaN(b1) && p1 > 0) {
      const lossAllowed = !isNaN(maxLossVal) ? maxLossVal : 1.0;
      const initialSL = b1 * (1 - (lossAllowed / p1));
      const ddPct = (lossAllowed / p1) * 100;
      if (initialSL > 0) {
        t1InitialSLOut.value = '$' + Number(initialSL.toFixed(3)) + ` (-${ddPct.toFixed(2)}%)`;
      } else {
        t1InitialSLOut.value = '無效 (P1 過小)';
      }
    } else {
      t1InitialSLOut.value = '';
    }

    // 2. 計算加倉相關
    const p1Dec = p1 / 100;
    if (isNaN(p1Dec) || isNaN(b1) || isNaN(sl) || isNaN(b2)) {
      p2MaxOut.value = '';
      totalPosOut.value = '-';
      avgCostOut.value = '-';
      pyramidStatus.innerText = '請填入 P1、B1、New SL 與 B2。';
      return;
    }

    if (b2 <= sl) {
      pyramidStatus.innerText = '⚠️ 加倉價 B2 必須大於全新止蝕價 New SL。';
      p2MaxOut.value = '無效';
      totalPosOut.value = '-';
      avgCostOut.value = '-';
      return;
    }

    // Trade 1 在觸發 SL 時對總資產帶來的盈虧百分比
    const p1ReturnAtSL = (sl - b1) / b1;
    const p1Contribution = p1Dec * p1ReturnAtSL;

    // Trade 2 下跌至 SL 時的損失幅度 (正數)
    const p2Drawdown = (b2 - sl) / b2;

    // 可分配給 Trade 2 的總虧損空間
    const allowedP2Loss = maxLoss + p1Contribution;

    if (allowedP2Loss <= 0) {
      pyramidStatus.innerText = '⚠️ Trade 1 虧損已超出上限，無法進行任何加倉！';
      p2MaxOut.value = '0.00%';
      totalPosOut.value = Number(p1.toFixed(2)) + '%';
      avgCostOut.value = '$' + Number(b1.toFixed(3));
      return;
    }

    // 計算 Trade 2 最大倉位佔比
    const p2 = allowedP2Loss / p2Drawdown;
    const p2Percent = p2 * 100;
    const totalPosPercent = (p1Dec + p2) * 100;

    // 計算加權平均成本
    const sharesWeight1 = p1Dec / b1;
    const sharesWeight2 = p2 / b2;
    const avgCost = (p1Dec + p2) / (sharesWeight1 + sharesWeight2);

    p2MaxOut.value = Number(p2Percent.toFixed(2)) + '%';
    totalPosOut.value = Number(totalPosPercent.toFixed(2)) + '%';
    avgCostOut.value = '$' + Number(avgCost.toFixed(3));

    if (p1Contribution > 0) {
      pyramidStatus.innerText = `✅ Trade 1 已鎖定 +${(p1Contribution * 100).toFixed(2)}% 利潤緩衝，容許更大加倉額。`;
    } else {
      pyramidStatus.innerText = `ℹ️ 觸發止蝕時，整體倉位最大虧損恰好為總本金的 ${(maxLoss * 100).toFixed(1)}%。`;
    }
  }
</script>

</body>
</html>
